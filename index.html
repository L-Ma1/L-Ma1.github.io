<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>6 Months with Bae ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root{
      --bg: #aad2ba;
      --heart-pink: #ff9fc0;
      --button-bg: #6b8f71;
    }

    html,body{
      height:100%;
      margin:0;
      padding:0;
    }

    body{
      background: var(--bg);
      font-family: Georgia, serif;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }

    #content {
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      z-index:5;
      padding:20px;
    }

    .question {
      font-size:3rem;
      color:#000;
      opacity:0;
      transform:scale(0.9);
      animation: showQuestion 0.6s forwards;
      padding:20px;
      max-width:90%;
      line-height:1.3;
    }

    @keyframes showQuestion {
      to {
        opacity:1;
        transform:scale(1);
      }
    }

    .heart {
      width:20px;
      height:20px;
      background-color: var(--heart-pink);
      position:absolute;
      transform:rotate(-45deg);
      animation: floatUp linear infinite;
      opacity:0;
      z-index:0;
      border-radius:3px;
    }

    .heart::before,
    .heart::after {
      content: "";
      width:20px;
      height:20px;
      background-color: var(--heart-pink);
      border-radius:50%;
      position:absolute;
      left:0;
    }

    .heart::before{
      top:-10px;
    }

    .heart::after{
      left:10px;
      top:0;
    }

    @keyframes floatUp{
      0% {
        transform: translateY(0) rotate(-45deg) scale(0.6);
        opacity:0;
      }
      10% {
        opacity:1;
      }
      100% {
        transform: translateY(-120vh) rotate(360deg) scale(1.2);
        opacity:0;
      }
    }

    .final {
      font-size:4rem;
      color:#000;
      text-shadow:2px 2px 8px rgba(255,159,192,0.6);
      opacity:0;
      transform:scale(0);
      animation: finalReveal 0.6s forwards;
      animation-delay:0.2s;
      text-align:center;
      margin-top:10px;
    }

    @keyframes finalReveal {
      to {
        opacity:1;
        transform:scale(1);
      }
    }

    .sticker{
      width:300px;
      height:300px;
      margin-top:40px;
      animation: popSticker 0.4s ease forwards;
      opacity:0;
      object-fit:contain;
    }
  /* CSS: bubbly border styles */
  .sticker-wrap{
    position: relative;
    width: 150px;
    height: 150px;
    display: inline-block;
    border-radius: 24px;
    padding: 10px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 20%),
                radial-gradient(circle at 70% 70%, rgba(255,200,220,0.12), transparent 20%),
                linear-gradient(135deg, rgba(255,255,255,0.06), rgba(0,0,0,0.02));
    box-shadow: 0 6px 18px rgba(0,0,0,0.12), inset 0 2px 6px rgba(255,255,255,0.08);
    overflow: visible;
    transition: transform 0.25s ease;
    z-index: 6;
  }
  
  /* sticker image */
  .sticker{
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 14px;
    display: block;
    transform-origin: center;
  }
  
  /* bubble base style (positioned absolutely around the wrapper) */
  .sticker-wrap .bubble{
    position: absolute;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.6) 30%, rgba(255,160,190,0.15) 60%);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transform: scale(0.6);
    animation: bubblePop 1.2s ease forwards;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  
  /* subtle hover pop */
  .sticker-wrap:hover{
    transform: scale(1.04);
  }

/* bubble animation */
@keyframes bubblePop {
  0% { opacity: 0; transform: scale(0.4) translateY(6px); }
  30% { opacity: 1; transform: scale(1.05) translateY(-2px); }
  100% { opacity: 0.85; transform: scale(0.9) translateY(-6px); }
}

    @keyframes popSticker {
      to {
        opacity:1;
        transform:scale(1.05);
      }
    }

    .hidden { display:none; }

    button {
      margin-top:20px;
      padding:10px 28px;
      background: var(--button-bg);
      border:none;
      border-radius:30px;
      color:#000;
      font-size:1.05rem;
      cursor:pointer;
      transition: transform 0.2s ease;
      box-shadow: 2px 2px 12px rgba(0,0,0,0.12);
    }

    button:hover { transform:scale(1.05); }
  </style>
</head>
<body>
  <div id="content">
    <div class="question" id="question"></div>
    <img src="" class="sticker hidden" id="sticker" alt="sticker" />
    <div class= "sticker-wrap hidden" id="stickerWrap"> 
      <img src="" class="sticker" id="sticker" alt="sticker" /> </div>
    <div class="final hidden" id="final">I love you the most in the world. Happy 6 months honey ❤️</div>
    <button id="nextBtn">Next</button>
  </div>

  <script>
    const questions = [
      "Happy 6 months babe! I hope you enjoy my hard work and my dedication to you because I love you so much!",
      "I am so thankful to have you on by side every morning to every night. Seeing you brighten my day and you truly bring the best out of me.",
      "To the rough patches to easy mornings, no matter what we go through, how we go through them, or when they have happen, you will always be my world and go through them together. ",
      "You are the best boyfriend anyone can ever ask for and I am so lucky to call you mine. I can't wait to see what else the future holds for us.",
      "Here is to many more months and memories together."
    ];

    const stickers = [
      "processed-E66AFF44-428A-4056-B485-C062597365C8.jpeg",
      "processed-516C1594-0DC0-4107-B3F9-737D98DB829F.jpeg",
      "3.png",
      "processed-7EB33739-EAC4-4313-B6DA-B0720C71ADB2.jpeg",
      "3.png"
    ];

    let step = 0;
    const questionEl = document.getElementById('question');
    const stickerEl = document.getElementById('sticker');
    const finalEl = document.getElementById('final');
    const nextBtn = document.getElementById('nextBtn');

    function showStep() {
      // show next question or final message
      if (step < questions.length) {
        // update text
        questionEl.textContent = questions[step];
        questionEl.classList.remove('hidden');
        // show sticker if available
        const src = stickers[step];
        if (src) {
          stickerEl.src = src;
          stickerEl.classList.remove('hidden');
        } else {
          stickerEl.classList.add('hidden');
        }
      } else {
        // final state
        questionEl.classList.add('hidden');
        stickerEl.classList.add('hidden');
        finalEl.classList.remove('hidden');
        nextBtn.style.display = 'none';
      }
      step++;
    }

    nextBtn.addEventListener('click', showStep);
    // show first step immediately
    showStep();

    // create floating hearts
    for (let i = 0; i < 30; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      // random horizontal position
      heart.style.left = Math.random() * 100 + 'vw';
      // random animation duration and delay
      heart.style.animationDuration = (5 + Math.random() * 6) + 's';
      heart.style.animationDelay = (Math.random() * 5) + 's';
      // random size
      const size = 10 + Math.random() * 30;
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';
      heart.style.borderRadius = Math.max(2, size * 0.15) + 'px';
      heart.style.opacity = 0;
      document.body.appendChild(heart);
    }
  </script>
</body>
</html>
