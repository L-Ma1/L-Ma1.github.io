<!DOCTYPE html>
<html>
<head>

  <style>
    body{

      font-family: 'Georgia', sans-serif;
      height: 100vh;
      display:flex;

      flex-direction: column;
      position: relative;
    }

    #content {
      display:flex;

      align-items:center;
      text-align:center;
      z-index:5;
    }
    .question {

      color:black;
      opacity: 0;
      transform:scale(0.8);
      animation: showQuestion 2s forward;
      padding: 20px;
      max-width: 90%;
    }
    @keyframes showQuestion {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .heart {
      width:20px;
      height:20px;
      background-color: pink;
      postion: absolute;
      top: 100%;
      transform: rotate (-45deg);
      animation: floatUp 8s linear infinite;
      opacity: 0;
      z-index: 0;
    }
    .heart: :before,
    .heart: :after {
      content: "";
      width: 20px;
      height: 20px
      background-color: pink;
      border-radius: 50%;
      position:absolute;
    }
    .heart: :before{
      top:-10px;
      left:0;
    }
    .heart : :after{
      top:10px;
      left:0;
    }
    @keyframes floatUp{
      0% {
        top:100%;
        opacity: 0;
        transform: translateX(0) translateY(0) rotate(-45deg) scale(0.5)
      }
      10% {
      opacity: 1;
      }
      100% {
        top:-10%;
        transform: translateX(0) translateY(-100vh) rotate(360deg) scale(1.2);
        opacity:0;
      }
      .final {

      color: black;
      text-shadow: 2px 2px 8px pink;
      opacity: 0;
      transform: scale(0);

    }

    @keyframes finalReveal {

        transform: scale(0);
      }
      100% {

        transform: scale(1);
      }
      .sticker{

      height: 150px;
      margin-top: 20px;
      animation: popSticker 1s ease forwards;
      opacity:0;
      object-fit:contain;
    }
    @keyframes popSticker {
      to {

    .hidden {diplay:none;}
    button {

      border-radius: 30px;
      color: black;
      font-size: 1.2rem;
      cursor:pointer;
      box-shawdow: 2px 2px 20px 485f4c;
      transition:transform 0.3s; 
    }
    button:hover {
      transform: scale(1.1);
    } 
  </style>
</head>

</html>
